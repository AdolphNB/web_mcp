# Included by nginx's http context. Shared zones cover all application workers.
# Static assets and health probes do not consume the page/API allowance.
map $uri $site_request_key {
    default $binary_remote_addr;
    ~^/(static|res)/ "";
    /health "";
    ~^/\.well-known/acme-challenge/ "";
}
map $uri $site_admin_key {
    default "";
    ~^/api/admin(/|$) $binary_remote_addr;
}
limit_req_zone $site_request_key zone=site_requests:10m rate=30r/s;
limit_req_zone $site_admin_key zone=site_admin:10m rate=5r/s;

# HTTP: redirect to HTTPS (also used by certbot for ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name singularitynear.com www.singularitynear.com;

    # Let certbot keep its ACME challenge working
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Force HTTPS for everything else
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name singularitynear.com www.singularitynear.com;

    # SSL Certificate (managed by certbot, paths are certbot default)
    ssl_certificate     /etc/letsencrypt/live/singularitynear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singularitynear.com/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS: tell browsers to always use HTTPS (1 year, include subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/mcptools-access.log;
    error_log /var/log/nginx/mcptools-error.log;

    # Maximum upload size
    client_max_body_size 10M;

    limit_req zone=site_requests burst=120 nodelay;
    limit_req zone=site_admin burst=30 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"detail":"Too many requests"}';
    }

    # Proxy to FastAPI application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Websocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering
        proxy_buffering off;
    }

    # Static files (optional - serve directly from Nginx for better performance)
    # location /static/ {
    #     alias /var/www/mcptools/static/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Redirect www to non-www (optional, remove if you want to keep www)
    if ($host = www.singularitynear.com) {
        return 301 https://singularitynear.com$request_uri;
    }
}
