/var/log/mcptools/access.log /var/log/mcptools/error.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    su www-data www-data
    create 0640 www-data www-data
    sharedscripts
    postrotate
        /usr/bin/supervisorctl signal USR1 mcptools >/dev/null 2>&1 || true
    endscript
}
